# =============================================================================
# Self-hosted Convex backend + dashboard for Resolvaio — COOLIFY variant.
#
# Deploy as a Coolify "Docker Compose" resource. Coolify + Traefik provide the
# public HTTPS domains via the SERVICE_FQDN_* magic variables below — no nginx.
#
# The backend needs TWO public hostnames (3210 and 3211 cannot share one host):
#   - backend  :3210  → CONVEX_CLOUD_ORIGIN  (NEXT_PUBLIC_CONVEX_URL)
#   - site     :3211  → CONVEX_SITE_ORIGIN   (CONVEX_SITE_URL — OAuth, HTTP actions)
#   - dashboard:6791  → admin UI (lock this down)
#
# Set these Coolify environment variables on the resource before deploy:
#   CONVEX_INSTANCE_SECRET   = <openssl rand -hex 32>   (unique to Resolvaio)
#   SERVICE_FQDN_BACKEND_3210  → e.g. convex-api.resolvaio.com
#   SERVICE_FQDN_SITE          → e.g. convex-http.resolvaio.com
#   SERVICE_FQDN_DASHBOARD_6791→ e.g. convex-dash.resolvaio.com
#
# After first boot, generate the admin key:
#   (Coolify → this resource → Terminal on `backend`)
#   ./generate_admin_key.sh
# =============================================================================

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    volumes:
      - convex_data:/convex/data
    environment:
      # Coolify generates the FQDN + Traefik labels for port 3210 from this bare
      # var, and exposes the resulting https URL as ${SERVICE_URL_BACKEND}.
      - SERVICE_FQDN_BACKEND_3210
      - CONVEX_CLOUD_ORIGIN=${SERVICE_URL_BACKEND}
      - CONVEX_SITE_ORIGIN=${SERVICE_URL_SITE}
      - INSTANCE_NAME=resolvaio
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET}
      - DISABLE_BEACON=true
      - REDACT_LOGS_TO_CLIENT=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/version']
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  # Tiny reverse proxy that gives port 3211 (HTTP actions / site origin) its own
  # public hostname, since Coolify exposes one FQDN per service.
  site:
    image: nginx:alpine
    environment:
      - SERVICE_FQDN_SITE
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "printf 'server { listen 80; location / { proxy_pass http://backend:3211;
      proxy_set_header Host \$$host; proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1; proxy_set_header Upgrade \$$http_upgrade;
      proxy_set_header Connection \"upgrade\"; } }' > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      - SERVICE_FQDN_DASHBOARD_6791
      - NEXT_PUBLIC_DEPLOYMENT_URL=${SERVICE_URL_BACKEND}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_data:
